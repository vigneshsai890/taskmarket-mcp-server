<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 610" role="img" aria-labelledby="title desc">
  <title id="title">TaskMarket MCP Server architecture map</title>
  <desc id="desc">Documentation-only architecture map for TaskMarket MCP Server.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#243449" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#55D6FF"/></marker>
    <style>
      .label{font:700 20px Arial,Helvetica,sans-serif;letter-spacing:1px}
      .sub{font:15px ui-monospace,SFMono-Regular,Menlo,monospace}
      .index{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace}
      .note{font:15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#D8E3EE}
      .meta{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px}
    </style>
  </defs>
  <rect width="1400" height="610" rx="18" fill="#07111D"/>
  <rect x="1" y="1" width="1398" height="608" rx="17" fill="url(#grid)" stroke="#A7FF3F" stroke-opacity=".55" stroke-width="2"/>
  <text x="80" y="70" class="meta" fill="#A7FF3F">SYSTEM MAP // TASKMARKET-MCP-SERVER</text>
  <text x="80" y="112" fill="#F4F8FF" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="900">TaskMarket MCP Server</text>
  <text x="80" y="145" fill="#9EB0C2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">agent tool call → server handler → TaskMarket remote API</text>
  <path d="M427.0 293.0 H445.0" class="arrow" marker-end="url(#arrow)"/><path d="M691.0 293.0 H709.0" class="arrow" marker-end="url(#arrow)"/><path d="M955.0 293.0 H973.0" class="arrow" marker-end="url(#arrow)"/>
  <g>
  <rect x="189.0" y="218" width="230" height="150" rx="12" fill="#0B1724" stroke="#A7FF3F" stroke-width="3"/>
  <rect x="189.0" y="218" width="230" height="9" rx="5" fill="#A7FF3F"/>
  <text x="304.0" y="285" class="label" text-anchor="middle" fill="#A7FF3F">MCP CLIENT</text>
  <text x="304.0" y="317" class="sub" text-anchor="middle" fill="#D8E3EE">Claude / Cursor / custom</text>
  <text x="211.0" y="350" class="index" fill="#7F93A8">01</text>
</g><g>
  <rect x="453.0" y="218" width="230" height="150" rx="12" fill="#0B1724" stroke="#55D6FF" stroke-width="3"/>
  <rect x="453.0" y="218" width="230" height="9" rx="5" fill="#55D6FF"/>
  <text x="568.0" y="285" class="label" text-anchor="middle" fill="#55D6FF">SERVER</text>
  <text x="568.0" y="317" class="sub" text-anchor="middle" fill="#D8E3EE">tool registration</text>
  <text x="475.0" y="350" class="index" fill="#7F93A8">02</text>
</g><g>
  <rect x="717.0" y="218" width="230" height="150" rx="12" fill="#0B1724" stroke="#FFB86B" stroke-width="3"/>
  <rect x="717.0" y="218" width="230" height="9" rx="5" fill="#FFB86B"/>
  <text x="832.0" y="285" class="label" text-anchor="middle" fill="#FFB86B">TASK TOOLS</text>
  <text x="832.0" y="317" class="sub" text-anchor="middle" fill="#D8E3EE">discover / browse / analyze</text>
  <text x="739.0" y="350" class="index" fill="#7F93A8">03</text>
</g><g>
  <rect x="981.0" y="218" width="230" height="150" rx="12" fill="#0B1724" stroke="#F4F7F8" stroke-width="3"/>
  <rect x="981.0" y="218" width="230" height="9" rx="5" fill="#F4F7F8"/>
  <text x="1096.0" y="285" class="label" text-anchor="middle" fill="#F4F7F8">TASKMARKET</text>
  <text x="1096.0" y="317" class="sub" text-anchor="middle" fill="#D8E3EE">remote API</text>
  <text x="1003.0" y="350" class="index" fill="#7F93A8">04</text>
</g>
  <path d="M80 452H1320" stroke="#55D6FF" stroke-opacity=".35"/>
  <text x="80" y="475" class="meta" fill="#55D6FF">DESIGN NOTES</text>
  <text x="80" y="490" class="note">The project intentionally keeps the agent-facing surface small and task-oriented.</text><text x="80" y="517" class="note">The original usage documentation is preserved below the presentation layer.</text>
  <text x="1320" y="570" class="meta" text-anchor="end" fill="#A7FF3F">DOCS-ONLY LAYER · SOURCE UNCHANGED</text>
</svg>
